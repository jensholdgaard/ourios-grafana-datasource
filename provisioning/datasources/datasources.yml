apiVersion: 1

datasources:
  - name: ourios
    uid: ourios
    type: ourios-ourios-datasource
    access: proxy
    isDefault: true
    orgId: 1
    editable: true
    jsonData:
      # The dev target: the dogfood querier on the host, agent-dogfood tenant.
      # The data proxy route attaches x-ourios-tenant from these values.
      url: http://host.docker.internal:4319
      tenant: agent-dogfood

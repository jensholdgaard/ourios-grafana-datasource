name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
  # Container e2e matrix: the declared-minimum image tag (0.5.0,
  # count-family only) alongside latest (typed columns, so the
  # wire-level sum suite runs), mirroring the Perses repo's
  # RFC0041.5 posture.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/jensholdgaard/ourios:0.5.0
            typed: ""
          - image: ghcr.io/jensholdgaard/ourios:latest
            typed: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:container-e2e
        env:
          OURIOS_IMAGE: ${{ matrix.image }}
          OURIOS_TYPED: ${{ matrix.typed }}
  # The single required-check anchor, mirroring the sibling repos' ci-success
  # pattern: branch protection and merge gates key off this one name.
  ci-success:
    needs: [checks, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all needs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "a needed job ended $r"; exit 1; }
          done
          echo "ci: success"

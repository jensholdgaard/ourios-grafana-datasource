name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
  # Container e2e matrix: the declared-minimum image tag (0.5.0,
  # count-family only) alongside latest (typed columns, so the
  # wire-level sum suite runs), mirroring the Perses repo's
  # RFC0041.5 posture.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/jensholdgaard/ourios:0.5.0
            typed: ""
          - image: ghcr.io/jensholdgaard/ourios:latest
            typed: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:container-e2e
        env:
          OURIOS_IMAGE: ${{ matrix.image }}
          OURIOS_TYPED: ${{ matrix.typed }}
  # Codegen no-diff: src/generated/semconv.ts must match the shared
  # ourios-semconv registry at the ref pinned in semconv-registry.ref
  # (the generated module is "do not hand-edit"; the registry is the
  # source). Weaver pin mirrors the ourios repo's semconv job.
  semconv:
    runs-on: ubuntu-latest
    env:
      WEAVER_VERSION: v0.23.0
      # sha256 of weaver-x86_64-unknown-linux-gnu.tar.xz for WEAVER_VERSION
      # (open-telemetry/weaver release asset). Bump both together.
      WEAVER_SHA256: a9822c712d6871bd89d6530f18c5df5cea3821f642e7b8e5e49e985917f7d12d
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install weaver
        run: |
          set -euo pipefail
          tarball="weaver-x86_64-unknown-linux-gnu.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/open-telemetry/weaver/releases/download/${WEAVER_VERSION}/${tarball}"
          echo "${WEAVER_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/weaver-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - run: ./scripts/semconv-generate.sh
      - name: Verify generated constants are in sync
        run: |
          set -euo pipefail
          changes="$(git status --porcelain -- src/generated)"
          if [ -n "$changes" ]; then
            echo "::error::src/generated/semconv.ts is out of sync with the pinned registry (semconv-registry.ref). Run npm run semconv:generate and commit."
            echo "$changes"
            git diff -- src/generated
            exit 1
          fi

  # The single required-check anchor, mirroring the sibling repos' ci-success
  # pattern: branch protection and merge gates key off this one name.
  ci-success:
    needs: [checks, e2e, semconv]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all needs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "a needed job ended $r"; exit 1; }
          done
          echo "ci: success"

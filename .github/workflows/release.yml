name: release

# Tag-driven: `git tag vX.Y.Z && git push origin vX.Y.Z` builds the
# plugin, packages it as <plugin-id>-<version>.zip (the layout Grafana
# expects: the dist tree under a directory named by the plugin id), and
# publishes it as a GitHub release. The archive is UNSIGNED — Grafana
# loads it with allow_loading_unsigned_plugins = ourios-ourios-datasource
# (signing needs a Grafana access-policy token; revisit on catalog
# submission). The tag must match the package.json version.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload the archive
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          [ "$TAG" = "v$pkg" ] || { echo "::error::tag $TAG != package.json v$pkg"; exit 1; }
      - run: npm ci
      # The same quality gates CI runs — a tag must not publish what a
      # PR could not merge.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          plugin_id="$(node -p "require('./dist/plugin.json').id")"
          version="$(node -p "require('./package.json').version")"
          staging="$RUNNER_TEMP/$plugin_id"
          mkdir -p "$staging"
          cp -R dist/. "$staging/"
          archive="$plugin_id-$version.zip"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/$archive" "$plugin_id")
          sha256sum "$archive" > "$archive.sha256"
          gh release create "$TAG" "$archive" "$archive.sha256" \
            --title "$TAG" \
            --generate-notes
